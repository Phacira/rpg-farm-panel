<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Академия магии — пульт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{--night:#17132a;--night2:#221c3b;--parch:#f4ead4;--ink:#2a2036;--gold:#d9b44a;--mute:#7a6e8a;--line:#e2d4b2;
  --astra:#4a7fe0;--verdant:#46a862;--vallor:#e0544e;--lumen:#9a68d8;--danger:#c4453c}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--night) radial-gradient(ellipse at 50% -10%,#3a2f63 0,transparent 60%);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;min-height:100vh}
header{text-align:center;padding:28px 16px 8px;color:var(--parch)}
header h1{font:700 clamp(32px,7vw,46px)/1.05 'Cormorant SC',Georgia,serif;margin:0;letter-spacing:.5px}
header p{margin:6px 0 0;color:#c9bde0}
main{max-width:720px;margin:0 auto;padding:12px 14px 48px;display:grid;gap:14px}
.card{background:var(--parch);border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:2px solid var(--line)}
.card h2{font:700 24px/1.1 'Cormorant SC',Georgia,serif;margin:0 0 10px}
.auth{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--parch)}
.auth b{color:#fff}
button{font:800 16px Nunito,sans-serif;border:0;border-radius:12px;min-height:46px;padding:10px 16px;cursor:pointer;background:var(--ink);color:#fff;transition:transform .08s,opacity .2s}
button:active{transform:scale(.97)} button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn-gold{background:var(--gold);color:#2a1e08}.btn-ghost{background:transparent;color:var(--parch);border:2px solid #5a4d82}
.btn-danger{background:var(--danger)}.btn-small{min-height:36px;padding:6px 12px;font-size:14px}
.status{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.portrait{width:104px;height:104px;border-radius:50%;background:#e7dcc0;border:4px solid var(--gold);overflow:hidden;display:grid;place-items:center}
.portrait,.mini{position:relative;overflow:hidden}.portrait img,.mini img{position:absolute;max-width:none;height:auto}
.mini{border-radius:50%;background:#e7dcc0;display:block;margin:0 auto}
.stage{background:#efe3c6;border-radius:16px;padding:8px 10px 4px;display:grid;place-items:end center;border:2px solid var(--line)}
.stage .fig{display:block}
.builder{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.preview .portrait{width:150px;height:150px}
.lbl2{margin:12px 0 6px;font-weight:800;color:#5b5070}.builder .lbl2:first-child{margin-top:0}
.seg{display:flex;gap:6px}.seg button{flex:1;background:#e4d7b8;color:var(--ink);min-height:42px}.seg button.on{background:var(--ink);color:#fff}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cdbd96}
.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.styles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.styles button{background:#ece0c2;color:var(--ink);padding:8px 4px;display:grid;gap:4px;justify-items:center;font-size:13px;min-height:0;border:2px solid transparent}
.styles button.on{border-color:var(--gold);background:#fff6dc}
.dots{display:flex;gap:6px;margin:6px 0 4px}.dots i{flex:1;height:6px;border-radius:3px;background:#e4d7b8}.dots i.done{background:var(--gold)}.dots i.cur{background:var(--ink)}
h2.q{font-size:26px;margin:12px 0}
.answers{display:grid;gap:8px}.answers button{background:#fff8e6;color:var(--ink);border:2px solid var(--line);text-align:left;font-weight:700}
.answers button:hover{border-color:var(--gold)}
@media(max-width:480px){.builder{grid-template-columns:1fr;justify-items:center}.opts{width:100%}.styles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.portrait.empty{font:700 44px 'Cormorant SC',serif;color:var(--mute)}
.big{font:700 30px/1.1 'Cormorant SC',Georgia,serif;margin:0}
.sub{margin:4px 0 0;color:#5b5070}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row button{flex:1 1 140px}
.res{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:#ece0c2;font-weight:700}
.res.bad{background:#f6d6cf;color:#7a2018}
.house{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:#fff;margin-top:12px}
.house svg{flex:none}
.house b{font:700 26px/1 'Cormorant SC',serif}
.cup{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:90px minmax(0,1fr) 44px;gap:10px;align-items:center;font-weight:800}
.bar i{display:block;height:14px;border-radius:7px;background:#e4d7b8;overflow:hidden}
.bar i span{display:block;height:100%;border-radius:7px}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--mute);font-size:14px;margin:8px 0 0}
.adm{background:#2a2346;color:var(--parch);border-color:#4a3f74}
.adm h2{color:var(--gold)}
.adm .sub{color:#c9bde0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{min-height:38px;padding:6px 12px;background:#3b3263;font-size:15px}
.chips button.on{background:var(--gold);color:#2a1e08}
.lbl{margin:16px 0 0;font-weight:800;color:#e8dcff}
.list{margin-top:8px;display:grid;gap:6px;max-height:320px;overflow:auto;padding-right:4px}
.item{display:flex;align-items:center;gap:8px;background:#352d58;border-radius:10px;padding:6px 6px 6px 12px}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .dot{width:10px;height:10px;border-radius:50%;flex:none}
.item button{min-height:34px;padding:4px 10px;font-size:13px;background:#5b3a55}
.item button.sure{background:var(--danger)}
input[type=search]{width:100%;font:16px Nunito,sans-serif;padding:10px 12px;border-radius:10px;border:2px solid #4a3f74;background:#1f1937;color:#fff;margin-top:8px}
.confirm{margin-top:10px;padding:12px;border-radius:12px;background:#4a2430}
.spin{display:inline-block;animation:sp 1.4s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
footer{text-align:center;color:#8d81a8;font-size:13px;padding:0 16px 24px}
@media(max-width:480px){.status{grid-template-columns:1fr;justify-items:center;text-align:center}.portrait{width:96px;height:96px}}
</style>
</head>
<body>
<header><h1>Академия магии</h1><p>Пульт ученика: поступление и ваш факультет</p></header>
<main>
  <div class="auth" id="auth"></div>
  <section class="card" id="me"></section>
  <section class="card" id="cup"><h2>Кубок факультетов</h2><div class="cup" id="bars"></div><p class="note" id="cupnote"></p></section>
  <section class="card adm" id="adm" hidden></section>
</main>
<footer>Кнопки действуют от вашего ника Twitch, в чат ничего не пишется.</footer>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
