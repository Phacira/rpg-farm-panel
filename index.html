<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPG-ферма — пульт зрителя</title><link rel="stylesheet" href="style.css"></head>
<body>
<section id="panel" class="panel"><h1>⚔ RPG-ферма: пульт зрителя</h1>
<div id="auth" class="auth"></div><p id="pmsg" class="pmsg" hidden></p>
<div id="pbody" hidden><div id="live" class="live">Подключение…</div><div id="tabs" class="tabs"></div>
<canvas id="map" width="960" height="540"></canvas><div id="linfo" class="note"></div><div id="hero"></div></div></section>
<header><h1>📜 Команды для чата</h1><input id="q" type="search" placeholder="Поиск команды: поход, грядка, босс…" aria-label="Поиск"><nav id="nav"></nav></header>
<main id="list"></main>
<footer>Нажмите «Скопировать команду» и вставьте её в чат стрима. Кнопки действий прямо отсюда появятся в следующих версиях пульта.</footer>
<script src="config.js"></script><script src="commands.js"></script><script src="panel.js"></script><script src="app.js"></script>
