<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPG-ферма — пульт зрителя</title><link rel="stylesheet" href="style.css"></head>

<section id="panel" class="panel"><h1>⚔ RPG-ферма: пульт зрителя</h1>

<script src="config.js"></script><script src="commands.js"></script><script src="actions.js"></script><script src="img/h/heroes.js"></script><script src="sprites.js"></script><script src="panel.js"></script><script src="app.js"></script>
