<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Живой лагерь — демо</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;background:#120c16;color:#efe3ff;font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
  .wrap{max-width:1500px;margin:0 auto;padding:14px}
  h1{font-size:18px;margin:0 0 8px;color:#ffd27a}
  .stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px #0008;background:#000}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .panel{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 0 4px;padding:10px 12px;background:#1d1424;border:1px solid #4a3560;border-radius:10px}
  .panel label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .panel input[type=checkbox]{accent-color:#ffd27a;width:16px;height:16px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:8px}
  .row input[type=range]{width:200px;accent-color:#ffd27a}
  .note{color:#b9a7cc;font-size:13px;margin-top:8px}
  .time{color:#ffd27a;font-weight:700;min-width:120px;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔥 Живой лагерь — демо эффектов</h1>
  <div class="stage"><canvas id="c" width="1792" height="1008"></canvas></div>
  <div class="panel" id="fx"></div>
  <div class="row">
    <span>Время суток:</span><span class="time" id="tlab"></span>
    <label><input type="checkbox" id="auto" checked> само меняется</label>
    <input type="range" id="tod" min="0" max="1000" value="350">
    <span>скорость:</span>
    <select id="spd"><option value="60">1 круг за 1 мин (для показа)</option><option value="600">за 10 мин</option><option value="3600">за 1 час</option><option value="14400">за 4 часа (как стрим)</option></select>
  </div>
  <div class="note">Галочками можно включать и выключать каждый эффект по отдельности, чтобы решить, что оставить. В игре всё это будет рисоваться поверх фона так же.</div>
</div>

function mkCanvas(w,h){const c=document.createElement('canvas'); c.width=w; c.height=h; return c;}
// --- облака: мягкие плоские пухлые формы в стиле нарисованных (тёмно-фиолетовые, снизу темнее, подсвечены закатом по краю)
function makeCloud(w){ const h=Math.round(w*0.28), c=mkCanvas(w,h+10), g=c.getContext('2d'); const n=5+Math.floor(Math.random()*4), blobs=[];
  for(let i=0;i<n;i++){ const bx=w*(0.12+0.76*i/(n-1))+rnd(-8,8), r=h*rnd(.28,.5); blobs.push([bx,h*0.62-r*0.35+rnd(-3,3),r]); }
  const path=()=>{g.beginPath(); blobs.forEach(([bx,by,r])=>{g.moveTo(bx+r,by); g.arc(bx,by,r,0,7);}); g.rect(w*0.08,h*0.55,w*0.84,h*0.3);};
  g.save(); path(); g.clip(); const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#7a5a8e'); gr.addColorStop(.55,'#5a3f72'); gr.addColorStop(1,'#3a2852'); g.fillStyle=gr; g.fillRect(0,0,w,h+10);
  g.globalCompositeOperation='source-atop'; const gl=g.createLinearGradient(0,h,0,h*0.5); gl.addColorStop(0,'rgba(240,130,80,.55)'); gl.addColorStop(1,'rgba(240,130,80,0)'); g.fillStyle=gl; g.fillRect(0,0,w,h+10); g.restore();
  g.save(); path(); g.lineWidth=2; g.strokeStyle='rgba(30,16,40,.55)'; g.stroke(); g.restore(); return c; }
let clouds=[], stars=[], sparks=[], steam=[], flies=[], leaves=[], birds=[], shooting=null, nextShoot=3, nextBirds=6;
async function init(){
  bg=await L(BG); const mi=await L(MASK);
  skyM=mkCanvas(W,H); const mg=skyM.getContext('2d'); mg.drawImage(mi,0,0,W,H);
  const id=mg.getImageData(0,0,W,H); for(let i=0;i<id.data.length;i+=4){ const v=id.data[i]; id.data[i]=id.data[i+1]=id.data[i+2]=0; id.data[i+3]=v; } mg.putImageData(id,0,0);
  for(let i=0;i<7;i++){ cloudSprites.push(makeCloud(Math.round(rnd(160,340)))); }
  for(let i=0;i<6;i++) clouds.push({s:cloudSprites[i%cloudSprites.length], x:rnd(-200,W), y:rnd(15,170), v:rnd(4,10), a:rnd(.55,.85)});
  // звёзды только в небе (по маске)
  const md=id.data; let tries=0; while(stars.length<70 && tries<5000){ tries++; const sx=Math.floor(rnd(0,W)), sy=Math.floor(rnd(0,230)); if(md[(sy*W+sx)*4+3]>200) stars.push({x:sx,y:sy,r:rnd(.6,1.6),p:rnd(0,6.28),f:rnd(.6,2.2)}); }
  for(let i=0;i<7;i++) flies.push(newFly());
  requestAnimationFrame(loop);
}
function newFly(){ const left=Math.random()<.5; return {x:left?rnd(10,330):rnd(1460,1780), y:rnd(720,980), vx:rnd(-6,6), vy:rnd(-4,4), p:rnd(0,6.28), life:rnd(6,14)}; }
// --- время суток: 0..1 (0 = поздний вечер/закат, 0.5 = глубокая ночь)
const todEl=document.getElementById('tod'), autoEl=document.getElementById('auto'), spdEl=document.getElementById('spd'), tlab=document.getElementById('tlab');
let tod=+todEl.value/1000; todEl.oninput=()=>{tod=+todEl.value/1000; autoEl.checked=false;};
function nightK(){ return on.daynight ? (0.5-0.5*Math.cos(tod*Math.PI*2)) : 0.35; } // 0 = закат, 1 = ночь
let last=performance.now(), T=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; T+=dt;
  if(autoEl.checked){ tod=(tod+dt/(+spdEl.value))%1; todEl.value=Math.round(tod*1000); }
  const nk=nightK(); tlab.textContent = nk<.25?'закат':nk<.6?'сумерки':'ночь';
  x.clearRect(0,0,W,H); x.drawImage(bg,0,0,W,H);
  // ---- слой неба (облака/звёзды), обрезан маской неба
  const sky=skyLayer(dt,nk); x.drawImage(sky,0,0);
  // ---- флаги
  if(on.flags) flags();
  // ---- общий тон по времени суток
  if(on.daynight){ x.save(); x.globalCompositeOperation='multiply'; x.fillStyle=`rgba(${Math.round(255-95*nk)},${Math.round(255-85*nk)},${Math.round(255-30*nk)},1)`; x.fillRect(0,0,W,H); x.restore();
    x.save(); x.globalAlpha=0.18*(1-nk); x.globalCompositeOperation='soft-light'; x.fillStyle='#ff9a5a'; x.fillRect(0,0,W,H); x.restore(); }
  // ---- свет костра
  if(on.fire) fireLight(nk);
  if(on.windows) windows(nk);
  if(on.steam) steamFx(dt);
  if(on.sparks) sparksFx(dt);
  if(on.ffly) fliesFx(dt,nk);
  if(on.leaves) leavesFx(dt);
  if(on.birds) birdsFx(dt);
  requestAnimationFrame(loop);
}
const skyC=mkCanvas(W,H), sg=skyC.getContext('2d');
function skyLayer(dt,nk){
  sg.clearRect(0,0,W,H);
  if(on.daynight){ sg.fillStyle=`rgba(18,10,40,${0.55*nk})`; sg.fillRect(0,0,W,H); } // небо темнеет к ночи сильнее, чем земля
  if(on.stars){ stars.forEach(s=>{ const tw=0.55+0.45*Math.sin(T*s.f+s.p); sg.globalAlpha=Math.min(1,(0.35+0.65*nk)*tw); sg.fillStyle='#fff7e0'; sg.beginPath(); sg.arc(s.x,s.y,s.r,0,7); sg.fill(); }); sg.globalAlpha=1; }
  if(on.shoot){ nextShoot-=dt; if(!shooting && nextShoot<=0 && nk>.3){ shooting={x:rnd(200,1500),y:rnd(10,90),vx:rnd(380,520)*(Math.random()<.5?-1:1),vy:rnd(120,180),t:0}; nextShoot=rnd(8,18);}
    if(shooting){ const s=shooting; s.t+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; const a=Math.max(0,1-s.t/0.9); const g=sg.createLinearGradient(s.x,s.y,s.x-s.vx*0.12,s.y-s.vy*0.12); g.addColorStop(0,`rgba(255,250,230,${a})`); g.addColorStop(1,'rgba(255,250,230,0)'); sg.strokeStyle=g; sg.lineWidth=2; sg.beginPath(); sg.moveTo(s.x,s.y); sg.lineTo(s.x-s.vx*0.12,s.y-s.vy*0.12); sg.stroke(); if(s.t>0.9) shooting=null; } }
  if(on.clouds){ clouds.forEach(c=>{ c.x+=c.v*dt; if(c.x>W+20){ c.x=-c.s.width-rnd(0,300); c.y=rnd(15,170); c.v=rnd(4,10); c.s=cloudSprites[Math.floor(Math.random()*cloudSprites.length)]; } sg.globalAlpha=c.a*(1-0.45*nk); sg.drawImage(c.s,Math.round(c.x),Math.round(c.y)); }); sg.globalAlpha=1; }
  sg.globalCompositeOperation='destination-in'; sg.drawImage(skyM,0,0); sg.globalCompositeOperation='source-over';
  return skyC;
}
function flags(){ BANNERS.forEach(([x0,y0,x1,y1],i)=>{ const h=y1-y0, w=x1-x0; for(let y=y0+6;y<y1;y++){ const k=(y-y0)/h, dx=Math.sin(T*1.6+i*1.3-k*4)*2.2*k*k; if(Math.abs(dx)<0.15) continue; x.drawImage(bg,x0,y,w,1,x0+dx,y,w,1); } }); }
function fireLight(nk){ const fl=0.85+0.1*Math.sin(T*9)+0.07*Math.sin(T*23+1)+0.05*Math.sin(T*41); const R=(300+60*nk)*fl;
  x.save(); x.globalCompositeOperation='lighter'; let g=x.createRadialGradient(FIRE.x,FIRE.y-20,0,FIRE.x,FIRE.y-20,R); g.addColorStop(0,`rgba(255,150,60,${0.30+0.15*nk})`); g.addColorStop(.35,`rgba(255,110,40,${0.10+0.06*nk})`); g.addColorStop(1,'rgba(255,90,30,0)'); x.fillStyle=g; x.fillRect(FIRE.x-R,FIRE.y-20-R,R*2,R*2);
  g=x.createRadialGradient(FIRE.x,FIRE.y-10,0,FIRE.x,FIRE.y-10,60*fl); g.addColorStop(0,'rgba(255,210,120,.35)'); g.addColorStop(1,'rgba(255,160,60,0)'); x.fillStyle=g; x.fillRect(FIRE.x-70,FIRE.y-80,140,140); x.restore(); }
function windows(nk){ x.save(); x.globalCompositeOperation='lighter'; WIN.forEach(([wx,wy,s],i)=>{ const f=0.6+0.4*Math.sin(T*(0.7+i*0.13)+i*2.1)*Math.sin(T*0.31+i); const r=4+Math.sqrt(s)*1.2; const g=x.createRadialGradient(wx,wy,0,wx,wy,r); g.addColorStop(0,`rgba(255,200,110,${(0.25+0.35*nk)*Math.max(0.2,f)})`); g.addColorStop(1,'rgba(255,170,80,0)'); x.fillStyle=g; x.fillRect(wx-r,wy-r,r*2,r*2); }); x.restore(); }
function sparksFx(dt){ if(Math.random()<dt*14) sparks.push({x:FIRE.x+rnd(-26,26),y:FIRE.y-20,vx:rnd(-12,12),vy:rnd(-70,-40),t:0,l:rnd(.8,1.8)}); x.save(); x.globalCompositeOperation='lighter'; sparks=sparks.filter(s=>{ s.t+=dt; s.x+=s.vx*dt+Math.sin(T*3+s.l*9)*0.3; s.y+=s.vy*dt; const a=1-s.t/s.l; if(a<=0) return false; x.fillStyle=`rgba(255,${160+Math.round(80*a)},80,${a})`; x.fillRect(Math.round(s.x),Math.round(s.y),2,2); return true; }); x.restore(); }
function steamFx(dt){ if(Math.random()<dt*3) steam.push({x:STEAM.x+rnd(-14,14),y:STEAM.y,r:rnd(8,13),t:0,l:rnd(2.5,3.8),vx:rnd(-4,4)}); x.save(); steam=steam.filter(s=>{ s.t+=dt; const k=s.t/s.l; if(k>=1) return false; s.y-=22*dt; s.x+=s.vx*dt+Math.sin(T*1.3+s.l)*0.15; const r=s.r*(1+k*1.6); x.globalAlpha=0.22*(1-k)*Math.min(1,k*5); x.fillStyle='#e8e0f0'; x.beginPath(); x.arc(s.x,s.y,r,0,7); x.fill(); return true; }); x.restore(); }
function fliesFx(dt,nk){ x.save(); x.globalCompositeOperation='lighter'; flies.forEach((f,i)=>{ f.life-=dt; if(f.life<=0) flies[i]=f=newFly(); f.vx+=rnd(-20,20)*dt; f.vy+=rnd(-20,20)*dt; f.vx*=.98; f.vy*=.98; f.x+=f.vx*dt; f.y+=f.vy*dt; const b=Math.max(0,Math.sin(T*2+f.p)); const a=(0.25+0.6*nk)*b; if(a<0.03) return; const g=x.createRadialGradient(f.x,f.y,0,f.x,f.y,6); g.addColorStop(0,`rgba(220,255,140,${a})`); g.addColorStop(1,'rgba(200,255,120,0)'); x.fillStyle=g; x.fillRect(f.x-6,f.y-6,12,12); }); x.restore(); }
function leavesFx(dt){ if(Math.random()<dt*0.35) leaves.push({x:rnd(-20,W*0.25)*(Math.random()<.5?1:0)+(Math.random()<.5?0:W*0.78),y:rnd(0,200),vx:rnd(15,35),vy:rnd(22,38),a:rnd(0,6.28),c:['#c8742e','#a8531f','#d99a3a'][Math.floor(Math.random()*3)]}); leaves=leaves.filter(l=>{ l.a+=dt*2.5; l.x+=l.vx*dt+Math.sin(l.a)*0.8; l.y+=l.vy*dt; if(l.y>H) return false; x.save(); x.translate(l.x,l.y); x.rotate(Math.sin(l.a)*0.9); x.fillStyle=l.c; x.strokeStyle='#3a1e10'; x.lineWidth=1; x.beginPath(); x.ellipse(0,0,6,3,0,0,7); x.fill(); x.stroke(); x.restore(); return true; }); }
function birdsFx(dt){ nextBirds-=dt; if(nextBirds<=0 && !birds.length){ const n=3+Math.floor(Math.random()*4), y=rnd(40,140), dir=Math.random()<.5?1:-1; for(let i=0;i<n;i++) birds.push({x:dir>0?-40-i*22:W+40+i*22, y:y+(i%2)*10+i*3, v:dir*rnd(70,90), p:rnd(0,6)}); nextBirds=rnd(18,35); }
  x.save(); x.strokeStyle='rgba(25,15,30,.85)'; x.lineWidth=2; birds=birds.filter(b=>{ b.x+=b.v*dt; const f=Math.sin(T*9+b.p)*4; x.beginPath(); x.moveTo(b.x-7,b.y-f); x.quadraticCurveTo(b.x-3,b.y-2,b.x,b.y); x.quadraticCurveTo(b.x+3,b.y-2,b.x+7,b.y-f); x.stroke(); return b.x>-80&&b.x<W+80; }); x.restore(); }
init();
})();
</script>
